name: "Build test"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Golang environment
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.4

      - name: Build repository
        shell: bash
        run: ./build.sh
